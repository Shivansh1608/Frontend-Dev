<!doctype html>
<html>
<body>
  <h1>Movie Ticket Booking</h1>

  <form id="movieForm">
    <label>Name</label>
    <input id="name">
    <div id="nameErr"></div>

    <label>Email</label>
    <input id="email">
    <div id="emailErr"></div>

    <label>Seats (1–10)</label>
    <input id="seats" type="number">
    <div id="seatsErr"></div>

    <button type="submit">Book Now</button>
  </form>

  <h2>Ticket Details</h2>
  <pre id="ticketOut"></pre>

  <script src="q5.js" defer></script>
</body>
</html>
