<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Card Flip Animation</title>
<style>
body {
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  background: #f2f2f2;
  margin: 0;
  font-family: Arial, sans-serif;
}

.card {
  width: 300px;
  height: 200px;
  perspective: 1000px;
}

.inner-card {
  position: relative;
  width: 100%;
  height: 100%;
  transform-style: preserve-3d;
  transition: transform 0.8s;
}

.card:hover .inner-card {
  transform: rotateY(180deg);
}

.front, .back {
  position: absolute;
  width: 100%;
  height: 100%;
  backface-visibility: hidden;
  border-radius: 10px;
  overflow: hidden;
  box-shadow: 0 4px 10px rgba(0,0,0,0.2);
}

.front {
  background: #fff;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

.front img {
  width: 100%;
  height: 120px;
  object-fit: cover;
}

.front h2 {
  margin: 10px;
  color: #333;
}

.back {
  background: #007bff;
  color: white;
  transform: rotateY(180deg);
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
  text-align: center;
}
</style>
</head>
<body>
  <div class="card">
    <div class="inner-card">
      <div class="front">
        <img src="https://picsum.photos/300/200" alt="Front Image">
        <h2>Beautiful View</h2>
      </div>
      <div class="back">
        <p>This card flips on hover using CSS 3D transformations and transitions.</p>
      </div>
    </div>
  </div>
</body>
</html>
