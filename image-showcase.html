<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Showcase</title>
  <link rel="stylesheet" href="image-showcase.css">
</head>
<body>
  <h1>Image Showcase Layout</h1>
  <div class="gallery">
    <figure>
      <img src="https://picsum.photos/300/200?1" alt="Image 1">
      <figcaption>Beautiful Landscape</figcaption>
    </figure>
    <figure>
      <img src="https://picsum.photos/300/200?2" alt="Image 2">
      <figcaption>Mountain View</figcaption>
    </figure>
    <figure>
      <img src="https://picsum.photos/300/200?3" alt="Image 3">
      <figcaption>City Lights</figcaption>
    </figure>
    <figure>
      <img src="https://picsum.photos/300/200?4" alt="Image 4">
      <figcaption>Sunset Glow</figcaption>
    </figure>
    <figure>
      <img src="https://picsum.photos/300/200?5" alt="Image 5">
      <figcaption>Nature Path</figcaption>
    </figure>
    <figure>
      <img src="https://picsum.photos/300/200?6" alt="Image 6">
      <figcaption>Calm Waters</figcaption>
    </figure>
  </div>
</body>
</html>
