<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Gallery</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background-color: #f5f5f5;
      padding: 40px;
    }

    h1 {
      text-align: center;
      margin-bottom: 30px;
      color: #333;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      height: 200px;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .card:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 15px rgba(0,0,0,0.2);
    }

    .card h3 {
      font-size: 1.2rem;
      margin-bottom: 10px;
      color: #004aad;
    }

    .card p {
      font-size: 1rem;
      color: #555;
      font-weight: 500;
    }

    /* Tablet View */
    @media (max-width: 900px) {
      .gallery {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    /* Mobile View */
    @media (max-width: 600px) {
      .gallery {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <h1>Product Gallery</h1>
  <div class="gallery">
    <div class="card">
      <h3>Wireless Headphones</h3>
      <p>₹1,499</p>
    </div>
    <div class="card">
      <h3>Smartwatch</h3>
      <p>₹2,299</p>
    </div>
    <div class="card">
      <h3>Bluetooth Speaker</h3>
      <p>₹1,999</p>
    </div>
    <div class="card">
      <h3>Fitness Tracker</h3>
      <p>₹999</p>
    </div>
    <div class="card">
      <h3>Wireless Mouse</h3>
      <p>₹699</p>
    </div>
    <div class="card">
      <h3>Portable Charger</h3>
      <p>₹1,199</p>
    </div>
    <div class="card">
      <h3>USB LED Lamp</h3>
      <p>₹349</p>
    </div>
    <div class="card">
      <h3>Gaming Keyboard</h3>
      <p>₹2,499</p>
    </div>
  </div>
</body>
</html>
