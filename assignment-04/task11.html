<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Info Form</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f2f2f2; padding: 20px; }
    form { max-width: 400px; margin: auto; padding: 20px; background: white; border-radius: 8px; box-shadow: 0 0 6px #ccc; }
    label { display: block; margin-top: 10px; }
    input, select { width: 100%; padding: 8px; margin-bottom: 10px; }
    button { padding: 10px 15px; background: #4a90e2; color: white; border: none; border-radius: 4px; cursor: pointer; }
  </style>
</head>
<body>
  <h2>Student Information</h2>
  <form>
    <label for="name">Name</label>
    <input type="text" id="name" name="name" required>

    <label for="roll">Roll Number</label>
    <input type="text" id="roll" name="roll" required>

    <label for="course">Course</label>
    <select id="course" name="course" required>
      <option value="" disabled selected>Select Course</option>
      <option value="bca">BCA</option>
      <option value="bsc">BSc</option>
      <option value="ba">BA</option>
    </select>

    <button type="submit">Submit</button>
  </form>
</body>
</html>
