<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Form with Iframe</title>
</head>
<body>
  <h2>Submit Form</h2>
  <form target="resultFrame" action="result.html" method="get">
    <input type="text" name="inputText" placeholder="Type something" required>
    <button type="submit">Submit</button>
  </form>
  <iframe name="resultFrame" width="100%" height="100px" style="border:1px solid #444; margin-top:10px;"></iframe>
</body>
</html>
