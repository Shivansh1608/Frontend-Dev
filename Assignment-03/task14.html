<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Database</title>
    <style>
        body {
            background: #f4f4f9;
            font-family: Arial, sans-serif;
            padding: 30px;
        }
        table {
            width: 80%;
            margin: auto;
            border-collapse: collapse;
            background: white;
            box-shadow: 0 0 8px #ccc;
        }
        caption {
            caption-side: top;
            font-size: 1.5em;
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
        }
        th, td {
            border: 1px solid #ccc;
            padding: 10px;
            text-align: center;
        }
        th {
            background-color: #4a90e2;
            color: white;
        }
        tr:nth-child(even) {
            background-color: #f2f6fc;
        }
        small {
            display: block;
            margin-top: 8px;
            color: #666;
        }
    </style>
</head>
<body>
    <table border="1" title="Movie List">
        <caption>Top Rated Movies</caption>
        <tr>
            <th>Movie Name</th>
            <th>Genre</th>
            <th>Year</th>
            <th>IMDB Rating</th>
            <th>Link</th>
        </tr>
        <tr>
            <td>Inception</td>
            <td>Sci-Fi</td>
            <td>2010</td>
            <td>8.8</td>
            <td><a href="https://www.imdb.com/title/tt1375666/">View</a></td>
        </tr>
        <tr>
            <td>Avengers: Endgame</td>
            <td>Action</td>
            <td>2019</td>
            <td>8.4</td>
            <td><a href="https://www.imdb.com/title/tt4154796/">View</a></td>
        </tr>
        <tr>
            <td>The Dark Knight</td>
            <td>Thriller</td>
            <td>2008</td>
            <td>9.0</td>
            <td><a href="https://www.imdb.com/title/tt0468569/">View</a></td>
        </tr>
        <tr>
            <td colspan="5"><small>Note: Ratings are based on IMDB data (2025).</small></td>
        </tr>
    </table>
</body>
</html>
