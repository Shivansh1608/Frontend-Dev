<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selection Page</title>
</head>
<body>
    <h1>Select Your Preferences</h1>

    <label for="country">Country:</label>
    <select id="country">
        <option selected>India</option>
        <option>USA</option>
        <option>Japan</option>
    </select>

    <label for="state">State:</label>
    <select id="state">
        <option selected>Uttar Pradesh</option>
        <option>Maharashtra</option>
        <option>Tamil Nadu</option>
    </select>

    <label for="city">City:</label>
    <select id="city">
        <option selected>Vrindavan</option>
        <option>Mumbai</option>
        <option>Delhi</option>
    </select>

    <label for="place">Favorite Tourist Place:</label>
    <select id="place">
        <option selected>Taj Mahal</option>
        <option>Gateway of India</option>
        <option>Charminar</option>
    </select>

    <p><b>Your Choices:</b> India → Uttar Pradesh → Vrindavan → Taj Mahal</p>
</body>
</html>
