<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini UI Layout</title>
  <link rel="stylesheet" href="mini-ui.css">
</head>
<body>
  <header>
    <h1>Mini UI Interface</h1>
  </header>

  <main class="card">
    <img src="https://picsum.photos/120/120" alt="Profile Image">
    <form>
      <input type="text" placeholder="Enter your name">
      <input type="email" placeholder="Enter your email">
      <div class="btn-group">
        <button type="submit" class="primary-btn">Submit</button>
        <button type="reset" class="secondary-btn">Reset</button>
      </div>
    </form>
  </main>

  <footer>
    <p>© 2025 Mini UI Layout | Designed by Shivansh</p>
  </footer>
</body>
</html>
