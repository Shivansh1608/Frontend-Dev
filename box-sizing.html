<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Box-Sizing Comparison</title>
  <link rel="stylesheet" href="box-sizing.css">
</head>
<body>
  <h1>Box-Sizing Comparison</h1>
  <div class="container">
    <div class="box default-box">
      <h2>Default (content-box)</h2>
      <p>Total size includes content + padding + border.</p>
    </div>
    <div class="box border-box">
      <h2>With border-box</h2>
      <p>Total size remains fixed—padding & border are inside.</p>
    </div>
  </div>
</body>
</html>
