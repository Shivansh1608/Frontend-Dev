<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photo Gallery</title>
  <style>
    /* General Page Styling */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Poppins", sans-serif;
    }

    body {
      background: #f4f7fb;
      color: #333;
      padding: 40px 20px;
    }

    h1 {
      text-align: center;
      font-size: 2.5rem;
      margin-bottom: 40px;
      color: #333;
    }

    /* Gallery Container */
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      max-width: 1200px;
      margin: auto;
    }

    /* Gallery Item */
    .gallery-item {
      position: relative;
      overflow: hidden;
      border-radius: 15px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
      cursor: pointer;
      transition: transform 0.3s ease;
    }

    /* Image Styling */
    .gallery-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s ease;
      display: block;
    }

    /* Caption Overlay */
    .caption {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(0, 0, 0, 0.6);
      color: #fff;
      text-align: center;
      padding: 15px 10px;
      font-size: 1.1rem;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    /* Hover Effects */
    .gallery-item:hover img {
      transform: scale(1.1);
    }

    .gallery-item:hover .caption {
      opacity: 1;
    }

    /* Responsive Padding */
    @media (max-width: 600px) {
      body {
        padding: 20px;
      }

      h1 {
        font-size: 2rem;
      }
    }
  </style>
</head>
<body>

  <h1>My Photo Gallery</h1>

  <div class="gallery">
    <div class="gallery-item">
      <img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=800&q=60" alt="Mountains">
      <div class="caption">Peaceful Mountains</div>
    </div>

    <div class="gallery-item">
      <img src="https://images.unsplash.com/photo-1491553895911-0055eca6402d?auto=format&fit=crop&w=800&q=60" alt="Beach">
      <div class="caption">Sunny Beach</div>
    </div>

    <div class="gallery-item">
      <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=800&q=60" alt="Ocean">
      <div class="caption">Ocean Breeze</div>
    </div>

    <div class="gallery-item">
      <img src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=800&q=60" alt="Forest">
      <div class="caption">Misty Forest</div>
    </div>

    <div class="gallery-item">
      <img src="https://images.unsplash.com/photo-1499084732479-de2c02d45fc4?auto=format&fit=crop&w=800&q=60" alt="Desert">
      <div class="caption">Golden Desert</div>
    </div>

    <div class="gallery-item">
      <img src="https://images.unsplash.com/photo-1499696010181-9d0b1f1f5d0b?auto=format&fit=crop&w=800&q=60" alt="City">
      <div class="caption">City Lights</div>
    </div>
  </div>

</body>
</html>
