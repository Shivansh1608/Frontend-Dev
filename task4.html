<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Layout</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      display: grid;
      grid-template-columns: 1fr 3fr;
      grid-template-rows: auto 1fr;
      grid-template-areas:
        "header header"
        "sidebar main";
      height: 100vh;
      gap: 20px;
      background-color: #f5f7fa;
      padding: 20px;
    }

    header {
      grid-area: header;
      background-color: #004aad;
      color: white;
      text-align: center;
      padding: 15px;
      font-size: 1.5rem;
      border-radius: 8px;
    }

    .sidebar {
      grid-area: sidebar;
      background-color: #fff;
      border-radius: 8px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 15px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    .sidebar a {
      text-decoration: none;
      color: #004aad;
      font-weight: 500;
      transition: color 0.3s ease;
    }

    .sidebar a:hover {
      color: #ff9900;
    }

    .main {
      grid-area: main;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      grid-template-rows: repeat(2, 1fr);
      gap: 20px;
    }

    .box {
      background-color: white;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 1.2rem;
      font-weight: 500;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .box:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 15px rgba(0,0,0,0.2);
    }

    .wide {
      grid-column: span 2;
    }

    @media (max-width: 800px) {
      body {
        grid-template-columns: 1fr;
        grid-template-areas:
          "header"
          "sidebar"
          "main";
      }
      .main {
        grid-template-columns: 1fr;
        grid-template-rows: auto;
      }
      .wide {
        grid-column: span 1;
      }
    }
  </style>
</head>
<body>
  <header>Dashboard Header</header>

  <div class="sidebar">
    <a href="#">Overview</a>
    <a href="#">Reports</a>
    <a href="#">Analytics</a>
    <a href="#">Settings</a>
  </div>

  <div class="main">
    <div class="box">Box 1</div>
    <div class="box">Box 2</div>
    <div class="box wide">Wide Box (Spans 2 Columns)</div>
    <div class="box">Box 3</div>
  </div>
</body>
</html>
