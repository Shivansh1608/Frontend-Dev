<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pseudo-Classes Demonstration</title>
  <link rel="stylesheet" href="pseudo-classes.css">
</head>
<body>
  <h1>Pseudo-Classes Examples</h1>
  <div class="container">
    <div class="example">
      <a href="#">Hover Link</a>
      <p>:hover changes color when you place the mouse pointer.</p>
    </div>
    <div class="example">
      <input type="text" placeholder="Focus me">
      <p>:focus applies style when an element is active for input.</p>
    </div>
    <div class="example">
      <button>Click Me</button>
      <p>:active changes color while the button is clicked.</p>
    </div>
    <div class="example">
      <ul>
        <li>Item 1</li>
        <li>Item 2</li>
        <li>Item 3</li>
        <li>Item 4</li>
      </ul>
      <p>:nth-child(odd) applies to every other list item.</p>
    </div>
  </div>
</body>
</html>
