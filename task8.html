<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Responsive Photo Gallery</title>
<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f9f9f9;
  padding: 20px;
}

h1 {
  text-align: center;
  margin-bottom: 30px;
  color: #333;
}

.gallery {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 20px;
}

figure {
  overflow: hidden;
  border-radius: 10px;
  background: #fff;
  box-shadow: 0 2px 8px rgba(0,0,0,0.1);
  margin: 0;
  text-align: center;
}

figure img {
  width: 100%;
  height: 200px;
  object-fit: cover;
  transition: transform 0.5s ease;
}

figure:hover img {
  transform: scale(1.08);
}

figcaption {
  padding: 10px;
  font-size: 16px;
  color: #444;
}
</style>
</head>
<body>
  <h1>Photo Gallery</h1>
  <div class="gallery">
    <figure>
      <img src="https://picsum.photos/400/300?random=1" alt="Photo 1">
      <figcaption>Mountain View</figcaption>
    </figure>
    <figure>
      <img src="https://picsum.photos/400/300?random=2" alt="Photo 2">
      <figcaption>Sunset Beach</figcaption>
    </figure>
    <figure>
      <img src="https://picsum.photos/400/300?random=3" alt="Photo 3">
      <figcaption>Forest Path</figcaption>
    </figure>
    <figure>
      <img src="https://picsum.photos/400/300?random=4" alt="Photo 4">
      <figcaption>City Lights</figcaption>
    </figure>
    <figure>
      <img src="https://picsum.photos/400/300?random=5" alt="Photo 5">
      <figcaption>Calm Lake</figcaption>
    </figure>
    <figure>
      <img src="https://picsum.photos/400/300?random=6" alt="Photo 6">
      <figcaption>Desert Dunes</figcaption>
    </figure>
    <figure>
      <img src="https://picsum.photos/400/300?random=7" alt="Photo 7">
      <figcaption>Snow Peaks</figcaption>
    </figure>
    <figure>
      <img src="https://picsum.photos/400/300?random=8" alt="Photo 8">
      <figcaption>Night Sky</figcaption>
    </figure>
  </div>
</body>
</html>
